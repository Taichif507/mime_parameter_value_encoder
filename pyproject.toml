[project]
name = "mime-parameter-value-encoder"
version = "0.1.0"
description = "Encodes non-ASCII values in Content-Disposition header parameters using RFC 2231 continuations"
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
